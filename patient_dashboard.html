{% load static %}
<head>
    <link rel="stylesheet" type="text/css" href="{% static 'css/vb.css' %}">
</head>
<body>
    <div class="dashboard-container">
        <h1>Welcome to the Patient Dashboard</h1>
        
        <div class="blog-posts">
            <h2>Blog Posts</h2>
            <ul>
                {% for blog in blogs %}
                    <li>
                        <h3>{{ blog.title }}</h3>
                        {% if blog.image %}
                            <img src="{{ blog.image.url }}" alt="{{ blog.title }}" class="blog-image">
                        {% else %}
                            <p>No image available</p>
                        {% endif %}
                        <p>{{ blog.summary }}</p>
                        <!-- Add the "Read more" link -->
                        <a href="{% url 'blog_detail' pk=blog.pk %}" class="read-more">Read more</a>
                    </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</body>
