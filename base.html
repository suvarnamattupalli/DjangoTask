<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Website{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/b.css' %}">
    {% block extra_head %}
    {% endblock %}
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="{% url 'home' %}">Home</a></li>
                <li><a href="{% url 'create_blog_post' %}">Create Blog Post</a></li>
                <li><a href="{% url 'view_blogs' %}">View Blogs</a></li>
            </ul>
        </nav>
    </header>

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>


    <!-- Load JavaScript files -->
    <script src="{% static 'js/scripts.js' %}"></script>
    {% block extra_js %}
    {% endblock %}
</body>
</html>
