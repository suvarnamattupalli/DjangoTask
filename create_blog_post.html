{% extends 'base.html' %}
{% load static %}
{% block content %}
<head>
<link rel="stylesheet" type="text/css" href="{% static 'css/cbp.css' %}">
</head>

<h2>Create New Blog Post</h2>

<form method="POST" enctype="multipart/form-data" class="create-blog-form">
    {% csrf_token %}
    {{ form.as_p }}
    {% if user.is_authenticated and user.profile.user_type == 'doctor' %}
        <li><a href="{% url 'create_blog_post' %}">Create Blog Post</a></li>
    {% endif %}
</form>

{% endblock %}
